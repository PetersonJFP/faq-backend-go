version: "2"
sql:
  - schema: "faq/schema.sql"
    queries: "faq/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "faq/db"
        emit_json_tags: true

  - schema: "users/schema.sql"
    queries: "users/queries.sql"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "users/db"
        emit_json_tags: true
